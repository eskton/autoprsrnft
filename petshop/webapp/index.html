<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Питомцы</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/style.css?v={{v}}">
</head>
<body>
  <header class="top">
    <div class="brand">🐾 Питомцы</div>
    <button class="balance" id="balance-btn" type="button" aria-label="Бонусный баланс">
      <span class="balance-label">Бонусы</span>
      <b id="balance">—</b>
    </button>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" id="tabs">
    <button type="button" data-tab="pets" class="active"><span class="ico">🐾</span>Питомцы</button>
    <button type="button" data-tab="shop"><span class="ico">🛒</span>Магазин</button>
    <button type="button" data-tab="profile"><span class="ico">👤</span>Профиль</button>
    <button type="button" data-tab="admin" hidden><span class="ico">🛠</span>Админ</button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>
  <div class="toast" id="toast" hidden></div>

  <script src="/static/app.js?v={{v}}"></script>
</body>
</html>
